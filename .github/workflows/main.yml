name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
        type: string
      payload:
        description: 'Base64 Encoded Payload'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Environment
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.client_payload.payload }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.inputs.payload }}" >> $GITHUB_ENV
          else
            echo "ERROR: No package_name provided"
            exit 1
          fi
          mkdir -p extracted_payload
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java

      - name: Process Payload
        run: |
          if [ -n "$PAYLOAD_DATA" ]; then
            echo "$PAYLOAD_DATA" > payload_b64.txt
            base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64 payload"; exit 1; }
            unzip -o payload.zip -d extracted_payload/ || true
            echo "Payload extracted successfully"
          fi

      - name: Copy AndroidManifest
        run: |
          if [ -f extracted_payload/AndroidManifest.xml ]; then
            cp extracted_payload/AndroidManifest.xml app/src/main/AndroidManifest.xml
          else
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

      - name: Clean Old Java Files
        run: |
          rm -rf app/src/main/java/com
          rm -rf app/src/main/java/*

      - name: Copy Java Files
        run: |
          JAVA_FILES=$(find extracted_payload -name "*.java" -type f)
          if [ -z "$JAVA_FILES" ]; then
            echo "ERROR: No Java files found"
            exit 1
          fi
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          for file in $JAVA_FILES; do
            cp "$file" "app/src/main/java/$PKG_PATH/"
            echo "Copied: $(basename $file)"
          done

      - name: Update Java Package Names
        run: |
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          for file in app/src/main/java/$PKG_PATH/*.java; do
            if [ -f "$file" ]; then
              sed -i "s/^package .*;/package $TARGET_PACKAGE;/g" "$file"
            fi
          done

      - name: Copy Layout and Resources
        run: |
          [ -d extracted_payload/res/layout ] && cp -r extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null
          [ -d extracted_payload/res/values ] && cp -r extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null
          [ -d extracted_payload/res/drawable ] && cp -r extracted_payload/res/drawable/* app/src/main/res/drawable/ 2>/dev/null
          [ -d extracted_payload/res/xml ] && cp -r extracted_payload/res/xml/* app/src/main/res/xml/ 2>/dev/null

      - name: Create Default Colors
        run: |
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/colors.xml
            echo '<resources>' >> app/src/main/res/values/colors.xml
            echo '    <color name="background">#FFFFFFFF</color>' >> app/src/main/res/values/colors.xml
            echo '    <color name="text_primary">#FF000000</color>' >> app/src/main/res/values/colors.xml
            echo '    <color name="white">#FFFFFFFF</color>' >> app/src/main/res/values/colors.xml
            echo '    <color name="black">#FF000000</color>' >> app/src/main/res/values/colors.xml
            echo '</resources>' >> app/src/main/res/values/colors.xml
          fi

      - name: Create Default Themes
        run: |
          if [ ! -f app/src/main/res/values/themes.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/themes.xml
            echo '<resources>' >> app/src/main/res/values/themes.xml
            echo '    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">' >> app/src/main/res/values/themes.xml
            echo '        <item name="android:windowBackground">@color/background</item>' >> app/src/main/res/values/themes.xml
            echo '        <item name="android:textColorPrimary">@color/text_primary</item>' >> app/src/main/res/values/themes.xml
            echo '        <item name="windowNoTitle">true</item>' >> app/src/main/res/values/themes.xml
            echo '        <item name="windowActionBar">false</item>' >> app/src/main/res/values/themes.xml
            echo '    </style>' >> app/src/main/res/values/themes.xml
            echo '</resources>' >> app/src/main/res/values/themes.xml
          fi

      - name: Create Default Layout
        run: |
          if [ ! -f app/src/main/res/layout/activity_main.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/layout/activity_main.xml
            echo '<LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/res/layout/activity_main.xml
            echo '    android:layout_width="match_parent"' >> app/src/main/res/layout/activity_main.xml
            echo '    android:layout_height="match_parent"' >> app/src/main/res/layout/activity_main.xml
            echo '    android:gravity="center"' >> app/src/main/res/layout/activity_main.xml
            echo '    android:orientation="vertical"' >> app/src/main/res/layout/activity_main.xml
            echo '    android:background="@color/background">' >> app/src/main/res/layout/activity_main.xml
            echo '    <TextView' >> app/src/main/res/layout/activity_main.xml
            echo '        android:id="@+id/tvHello"' >> app/src/main/res/layout/activity_main.xml
            echo '        android:layout_width="wrap_content"' >> app/src/main/res/layout/activity_main.xml
            echo '        android:layout_height="wrap_content"' >> app/src/main/res/layout/activity_main.xml
            echo '        android:text="$APP_NAME"' >> app/src/main/res/layout/activity_main.xml
            echo '        android:textSize="28sp"' >> app/src/main/res/layout/activity_main.xml
            echo '        android:textColor="@color/text_primary"' >> app/src/main/res/layout/activity_main.xml
            echo '        android:textStyle="bold"/>' >> app/src/main/res/layout/activity_main.xml
            echo '</LinearLayout>' >> app/src/main/res/layout/activity_main.xml
            sed -i "s/\$APP_NAME/$APP_NAME/g" app/src/main/res/layout/activity_main.xml
          fi

      - name: Copy App Icon
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            for size in hdpi xhdpi xxhdpi; do
              cp extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher.png
              cp extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher_round.png
            done
          fi

      - name: Update Manifest Label
        run: |
          sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/g" app/src/main/AndroidManifest.xml

      - name: Generate Gradle Files
        run: |
          echo 'pluginManagement {' > settings.gradle
          echo '    repositories { google(); mavenCentral(); gradlePluginPortal() }' >> settings.gradle
          echo '}' >> settings.gradle
          echo 'dependencyResolutionManagement {' >> settings.gradle
          echo '    repositories { google(); mavenCentral() }' >> settings.gradle
          echo '}' >> settings.gradle
          echo 'rootProject.name = "MyApp"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle

          echo 'plugins {' > build.gradle
          echo '    id "com.android.application" version "8.2.2" apply false' >> build.gradle
          echo '}' >> build.gradle

          echo 'plugins { id "com.android.application" }' > app/build.gradle
          echo 'android {' >> app/build.gradle
          echo '    namespace "'$TARGET_PACKAGE'"' >> app/build.gradle
          echo '    compileSdk 34' >> app/build.gradle
          echo '    defaultConfig {' >> app/build.gradle
          echo '        applicationId "'$TARGET_PACKAGE'"' >> app/build.gradle
          echo '        minSdk 21' >> app/build.gradle
          echo '        targetSdk 34' >> app/build.gradle
          echo '        versionCode 1' >> app/build.gradle
          echo '        versionName "1.0"' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '    compileOptions {' >> app/build.gradle
          echo '        sourceCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '        targetCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo 'dependencies {' >> app/build.gradle
          echo '    implementation "androidx.appcompat:appcompat:1.6.1"' >> app/build.gradle
          echo '    implementation "com.google.android.material:material:1.11.0"' >> app/build.gradle
          echo '    implementation "androidx.constraintlayout:constraintlayout:2.1.4"' >> app/build.gradle
          echo '}' >> app/build.gradle

      - name: Create gradle.properties
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties

      - name: Setup Gradle Wrapper
        run: |
          gradle wrapper --gradle-version=8.5 --distribution-type=bin --no-daemon
          chmod +x gradlew

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon
          rm -rf app/build
          rm -rf .gradle
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK built successfully!"
          else
            echo "❌ APK not found"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Logs
          path: app/build/reports/
          retention-days: 3
          if-no-files-found: ignore

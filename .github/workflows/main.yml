name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Environment
        run: |
          if [ -z "${{ github.event.client_payload.package_name }}" ]; then
            echo "ERROR: package_name required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.app_name }}" ]; then
            echo "ERROR: app_name required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.payload }}" ]; then
            echo "ERROR: payload required"
            exit 1
          fi
          echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
          mkdir -p extracted_payload

      - name: Process Payload
        run: |
          echo "${{ github.event.client_payload.payload }}" > payload_b64.txt
          base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64"; exit 1; }
          unzip -o payload.zip -d extracted_payload/ || true

      - name: Setup Directories
        run: |
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java

      - name: Copy Resources
        run: |
          [ -d extracted_payload/res/layout ] && cp -rn extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null || true
          [ -d extracted_payload/res/drawable ] && cp -rn extracted_payload/res/drawable/* app/src/main/res/drawable/ 2>/dev/null || true
          [ -d extracted_payload/res/values ] && cp -rn extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null || true
          [ -d extracted_payload/res/xml ] && cp -rn extracted_payload/res/xml/* app/src/main/res/xml/ 2>/dev/null || true

      - name: Create Default Themes
        run: |
          if [ ! -f app/src/main/res/values/themes.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/themes.xml
            echo '<resources>' >> app/src/main/res/values/themes.xml
            echo '    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">' >> app/src/main/res/values/themes.xml
            echo '        <item name="windowNoTitle">true</item>' >> app/src/main/res/values/themes.xml
            echo '        <item name="windowActionBar">false</item>' >> app/src/main/res/values/themes.xml
            echo '    </style>' >> app/src/main/res/values/themes.xml
            echo '</resources>' >> app/src/main/res/values/themes.xml
          fi

      - name: Create Default Colors
        run: |
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/values/colors.xml
            echo '<resources>' >> app/src/main/res/values/colors.xml
            echo '    <color name="black">#000000</color>' >> app/src/main/res/values/colors.xml
            echo '    <color name="white">#FFFFFF</color>' >> app/src/main/res/values/colors.xml
            echo '</resources>' >> app/src/main/res/values/colors.xml
          fi

      - name: Create Network Security Config
        run: |
          if [ ! -f app/src/main/res/xml/network_security_config.xml ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/res/xml/network_security_config.xml
            echo '<network-security-config>' >> app/src/main/res/xml/network_security_config.xml
            echo '    <base-config cleartextTrafficPermitted="true">' >> app/src/main/res/xml/network_security_config.xml
            echo '        <trust-anchors>' >> app/src/main/res/xml/network_security_config.xml
            echo '            <certificates src="system" />' >> app/src/main/res/xml/network_security_config.xml
            echo '        </trust-anchors>' >> app/src/main/res/xml/network_security_config.xml
            echo '    </base-config>' >> app/src/main/res/xml/network_security_config.xml
            echo '</network-security-config>' >> app/src/main/res/xml/network_security_config.xml
          fi

      - name: Setup Icon
        run: |
          if [ -f extracted_payload/app_icon.png ] && file extracted_payload/app_icon.png | grep -q PNG; then
            for size in hdpi xhdpi xxhdpi; do
              cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher.png
              cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher_round.png
            done
          else
            for size in hdpi xhdpi xxhdpi; do
              echo 'iVBORw0KGgoAAAANSUhEUgAAAEgAAABICAYAAABV7bNHAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAZdEVYdFNvZnR3YXJlAHBhaW50Lm5ldCA0LjAuMTM0A1t6AAAAIElEQVR4Xu3BAQ0AAADCoPdPbQ8HFAAAAAAAAAAAAAAA8GYhUAABcE0iPQAAAABJRU5ErkJggg==' | base64 -d > app/src/main/res/mipmap-$size/ic_launcher.png
              cp app/src/main/res/mipmap-$size/ic_launcher.png app/src/main/res/mipmap-$size/ic_launcher_round.png
            done
          fi

      - name: Create settings.gradle
        run: |
          echo 'pluginManagement {' > settings.gradle
          echo '    repositories {' >> settings.gradle
          echo '        google()' >> settings.gradle
          echo '        mavenCentral()' >> settings.gradle
          echo '        gradlePluginPortal()' >> settings.gradle
          echo '    }' >> settings.gradle
          echo '}' >> settings.gradle
          echo '' >> settings.gradle
          echo 'dependencyResolutionManagement {' >> settings.gradle
          echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle
          echo '    repositories {' >> settings.gradle
          echo '        google()' >> settings.gradle
          echo '        mavenCentral()' >> settings.gradle
          echo '    }' >> settings.gradle
          echo '}' >> settings.gradle
          echo '' >> settings.gradle
          echo 'rootProject.name = "MyApp"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle

      - name: Generate Gradle Build File
        run: |
          echo 'plugins {' > app/build.gradle
          echo '    id "com.android.application"' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo '' >> app/build.gradle
          echo 'android {' >> app/build.gradle
          echo '    namespace "'"${{ env.TARGET_PACKAGE }}"'"' >> app/build.gradle
          echo '    compileSdk 34' >> app/build.gradle
          echo '' >> app/build.gradle
          echo '    defaultConfig {' >> app/build.gradle
          echo '        applicationId "'"${{ env.TARGET_PACKAGE }}"'"' >> app/build.gradle
          echo '        minSdk 21' >> app/build.gradle
          echo '        targetSdk 34' >> app/build.gradle
          echo '        versionCode 1' >> app/build.gradle
          echo '        versionName "1.0"' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '' >> app/build.gradle
          echo '    buildFeatures {' >> app/build.gradle
          echo '        viewBinding true' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '' >> app/build.gradle
          echo '    compileOptions {' >> app/build.gradle
          echo '        sourceCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '        targetCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo '' >> app/build.gradle
          echo 'dependencies {' >> app/build.gradle
          echo '    implementation "androidx.appcompat:appcompat:1.6.1"' >> app/build.gradle
          echo '    implementation "com.google.android.material:material:1.11.0"' >> app/build.gradle
          echo '    implementation "androidx.constraintlayout:constraintlayout:2.1.4"' >> app/build.gradle
          echo '}' >> app/build.gradle

      - name: Create root build.gradle
        run: |
          echo 'plugins {' > build.gradle
          echo '    id "com.android.application" version "8.2.2" apply false' >> build.gradle
          echo '}' >> build.gradle

      - name: Map Java Code
        run: |
          rm -rf app/src/main/java/*
          PKG_PATH=$(echo "${{ env.TARGET_PACKAGE }}" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          find extracted_payload -name "*.java" -type f -exec cp -f {} "app/src/main/java/$PKG_PATH/" \; 2>/dev/null || true
          find "app/src/main/java/$PKG_PATH" -name "*.java" -type f -exec sed -i "s/^package .*;/package ${{ env.TARGET_PACKAGE }};/g" {} \;

      - name: Generate Android Manifest
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>' > app/src/main/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android"' >> app/src/main/AndroidManifest.xml
          echo '    xmlns:tools="http://schemas.android.com/tools"' >> app/src/main/AndroidManifest.xml
          echo '    package="${{ env.TARGET_PACKAGE }}">' >> app/src/main/AndroidManifest.xml
          echo '' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.INTERNET" />' >> app/src/main/AndroidManifest.xml
          echo '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' >> app/src/main/AndroidManifest.xml
          echo '' >> app/src/main/AndroidManifest.xml
          echo '    <application' >> app/src/main/AndroidManifest.xml
          echo '        android:allowBackup="true"' >> app/src/main/AndroidManifest.xml
          echo '        android:label="${{ env.APP_NAME }}"' >> app/src/main/AndroidManifest.xml
          echo '        android:icon="@mipmap/ic_launcher"' >> app/src/main/AndroidManifest.xml
          echo '        android:roundIcon="@mipmap/ic_launcher_round"' >> app/src/main/AndroidManifest.xml
          echo '        android:theme="@style/Theme.AppCompat.NoActionBar"' >> app/src/main/AndroidManifest.xml
          echo '        android:usesCleartextTraffic="true"' >> app/src/main/AndroidManifest.xml
          echo '        android:networkSecurityConfig="@xml/network_security_config"' >> app/src/main/AndroidManifest.xml
          echo '        tools:replace="android:theme,android:label,android:usesCleartextTraffic">' >> app/src/main/AndroidManifest.xml
          echo '' >> app/src/main/AndroidManifest.xml
          echo '        <activity' >> app/src/main/AndroidManifest.xml
          echo '            android:name=".MainActivity"' >> app/src/main/AndroidManifest.xml
          echo '            android:exported="true"' >> app/src/main/AndroidManifest.xml
          echo '            android:configChanges="orientation|screenSize|keyboardHidden">' >> app/src/main/AndroidManifest.xml
          echo '            <intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '                <action android:name="android.intent.action.MAIN" />' >> app/src/main/AndroidManifest.xml
          echo '                <category android:name="android.intent.category.LAUNCHER" />' >> app/src/main/AndroidManifest.xml
          echo '            </intent-filter>' >> app/src/main/AndroidManifest.xml
          echo '        </activity>' >> app/src/main/AndroidManifest.xml
          echo '    </application>' >> app/src/main/AndroidManifest.xml
          echo '</manifest>' >> app/src/main/AndroidManifest.xml

      - name: Create gradle.properties
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties

      - name: Setup Gradle Wrapper
        run: |
          # Clean any existing wrapper files
          rm -rf gradle gradlew gradlew.bat gradle-wrapper.jar gradle-wrapper.properties 2>/dev/null || true
          
          # Generate fresh wrapper
          gradle wrapper --gradle-version=8.5 --distribution-type=bin --no-daemon
          
          # Make gradlew executable
          chmod +x gradlew
          
          # Verify wrapper jar exists
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar not found, downloading..."
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build APK
        run: |
          # Make sure gradlew is executable
          chmod +x gradlew
          
          # Grant execute permission
          chmod +x gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
          
          # Clean and build
          ./gradlew clean --no-daemon --stacktrace || true
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Logs
          path: |
            app/build/reports/
            build.log
          retention-days: 3

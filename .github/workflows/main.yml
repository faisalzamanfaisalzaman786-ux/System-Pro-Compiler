name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Download Missing Gradle Wrapper Jar
        run: |
          mkdir -p gradle/wrapper
          wget -O gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar

      - name: Clean Cache Before Execution
        run: ./gradlew clean

      - name: Extract Code Matrix Payload
        run: |
          echo "Processing payload..."

      - name: Dynamically Inject Package and Code Matrix
        run: |
          echo "Injecting code changes..."

      - name: Compile Premium Application Build
        run: ./gradlew assembleDebug

      - name: Upload Finished Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Premium-Build
          path: app/build/outputs/apk/debug/app-debug.apk

name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
        type: string
      payload:
        description: 'Base64 Encoded Payload'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Environment
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.client_payload.payload }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.inputs.payload }}" >> $GITHUB_ENV
          else
            echo "ERROR: No package_name provided"
            exit 1
          fi
          mkdir -p extracted_payload
          mkdir -p app/src/main
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java

      - name: Process Payload
        run: |
          if [ -n "$PAYLOAD_DATA" ]; then
            echo "$PAYLOAD_DATA" > payload_b64.txt
            base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64 payload"; exit 1; }
            unzip -o payload.zip -d extracted_payload/ || true
            echo "Payload extracted successfully"
          else
            echo "No payload provided"
          fi

      - name: Copy AndroidManifest from Payload
        run: |
          if [ -f extracted_payload/AndroidManifest.xml ]; then
            cp -f extracted_payload/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "AndroidManifest.xml copied from payload"
          else
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

      - name: Copy Java Files from Payload
        run: |
          JAVA_FILES=$(find extracted_payload -name "*.java" -type f 2>/dev/null || echo "")
          if [ -z "$JAVA_FILES" ]; then
            echo "ERROR: No Java files found"
            exit 1
          fi
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          echo "$JAVA_FILES" | while read file; do
            if [ -f "$file" ]; then
              cp -f "$file" "app/src/main/java/$PKG_PATH/"
              echo "Copied: $(basename $file)"
            fi
          done
          echo "Java files copied"

      - name: Smart Update Package in Java Files
        run: |
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          for file in app/src/main/java/$PKG_PATH/*.java; do
            if [ -f "$file" ]; then
              if grep -q "^package .*;" "$file" 2>/dev/null; then
                CURRENT_PKG=$(grep "^package .*;" "$file" | sed 's/package \(.*\);/\\1/')
                if [ "$CURRENT_PKG" != "$TARGET_PACKAGE" ]; then
                  sed -i "s/^package .*;/package $TARGET_PACKAGE;/g" "$file"
                  echo "Updated package in: $(basename $file)"
                fi
              else
                echo "package $TARGET_PACKAGE;" | cat - "$file" > temp && mv temp "$file"
                echo "Added package line to: $(basename $file)"
              fi
            fi
          done

      - name: Copy Layout Files from Payload
        run: |
          if [ -d extracted_payload/res/layout ]; then
            cp -rf extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null
            echo "Layout files copied"
          fi

      - name: Copy Resource Files from Payload
        run: |
          if [ -d extracted_payload/res/drawable ]; then
            cp -rf extracted_payload/res/drawable/* app/src/main/res/drawable/ 2>/dev/null
          fi
          if [ -d extracted_payload/res/values ]; then
            cp -rf extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null
          fi
          if [ -d extracted_payload/res/xml ]; then
            cp -rf extracted_payload/res/xml/* app/src/main/res/xml/ 2>/dev/null
          fi
          echo "Resources copied"

      - name: Copy App Icon from Payload
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            for size in hdpi xhdpi xxhdpi; do
              cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher.png
              cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher_round.png
            done
            echo "App icon copied"
          fi

      - name: Smart Update Manifest
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/g" app/src/main/AndroidManifest.xml
            echo "Updated app label to: $APP_NAME"
            if grep -q "package=\"" app/src/main/AndroidManifest.xml; then
              sed -i "s/package=\"[^\"]*\"/package=\"$TARGET_PACKAGE\"/g" app/src/main/AndroidManifest.xml
              echo "Updated package attribute"
            fi
          fi

      - name: Generate Gradle Build Files
        run: |
          echo 'pluginManagement {' > settings.gradle
          echo '    repositories {' >> settings.gradle
          echo '        google()' >> settings.gradle
          echo '        mavenCentral()' >> settings.gradle
          echo '        gradlePluginPortal()' >> settings.gradle
          echo '    }' >> settings.gradle
          echo '}' >> settings.gradle
          echo '' >> settings.gradle
          echo 'dependencyResolutionManagement {' >> settings.gradle
          echo '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' >> settings.gradle
          echo '    repositories {' >> settings.gradle
          echo '        google()' >> settings.gradle
          echo '        mavenCentral()' >> settings.gradle
          echo '    }' >> settings.gradle
          echo '}' >> settings.gradle
          echo '' >> settings.gradle
          echo 'rootProject.name = "MyApp"' >> settings.gradle
          echo 'include ":app"' >> settings.gradle

      - name: Create Root Build Gradle
        run: |
          echo 'plugins {' > build.gradle
          echo '    id "com.android.application" version "8.2.2" apply false' >> build.gradle
          echo '}' >> build.gradle

      - name: Create App Build Gradle
        run: |
          echo 'plugins {' > app/build.gradle
          echo '    id "com.android.application"' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo '' >> app/build.gradle
          echo 'android {' >> app/build.gradle
          echo '    namespace "'"$TARGET_PACKAGE"'"' >> app/build.gradle
          echo '    compileSdk 34' >> app/build.gradle
          echo '' >> app/build.gradle
          echo '    defaultConfig {' >> app/build.gradle
          echo '        applicationId "'"$TARGET_PACKAGE"'"' >> app/build.gradle
          echo '        minSdk 21' >> app/build.gradle
          echo '        targetSdk 34' >> app/build.gradle
          echo '        versionCode 1' >> app/build.gradle
          echo '        versionName "1.0"' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '' >> app/build.gradle
          echo '    compileOptions {' >> app/build.gradle
          echo '        sourceCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '        targetCompatibility JavaVersion.VERSION_17' >> app/build.gradle
          echo '    }' >> app/build.gradle
          echo '}' >> app/build.gradle
          echo '' >> app/build.gradle
          echo 'dependencies {' >> app/build.gradle
          echo '    implementation "androidx.appcompat:appcompat:1.6.1"' >> app/build.gradle
          echo '    implementation "com.google.android.material:material:1.11.0"' >> app/build.gradle
          echo '    implementation "androidx.constraintlayout:constraintlayout:2.1.4"' >> app/build.gradle
          echo '}' >> app/build.gradle

      - name: Create gradle.properties
        run: |
          echo 'org.gradle.jvmargs=-Xmx2048m' > gradle.properties
          echo 'android.useAndroidX=true' >> gradle.properties
          echo 'android.enableJetifier=true' >> gradle.properties

      - name: Setup Gradle Wrapper
        run: |
          rm -rf gradle gradlew gradlew.bat gradle-wrapper.jar gradle-wrapper.properties 2>/dev/null || true
          gradle wrapper --gradle-version=8.5 --distribution-type=bin --no-daemon
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
            chmod +x gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Clean and Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean --no-daemon --stacktrace || true
          rm -rf app/build
          rm -rf .gradle
          ./gradlew :app:generateDebugRFile --no-daemon --stacktrace || true
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK built successfully!"
          else
            echo "APK not found"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Logs
          path: app/build/reports/
          retention-days: 3

      - name: Cleanup
        if: always()
        run: |
          rm -f payload_b64.txt payload.zip 2>/dev/null || true
          rm -rf extracted_payload 2>/dev/null || true

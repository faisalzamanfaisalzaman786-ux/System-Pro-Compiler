name: System Pro Titan Master Engine

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  orchestrate-ecosystem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Node
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Resolve Package and Paths
        run: |
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
          
          echo "TARGET_PACKAGE=$PKG_NAME" >> $GITHUB_ENV
          echo "TARGET_PATH=$PKG_PATH" >> $GITHUB_ENV
          
          mkdir -p "app/src/main/java/$PKG_PATH"
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable

      - name: Inject Master Gradle Framework
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "System Pro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace "${{ env.TARGET_PACKAGE }}"
              compileSdk 34
              defaultConfig {
                  applicationId "${{ env.TARGET_PACKAGE }}"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF

      - name: Verify and Standardize Manifest Context
        run: |
          MANIFEST_PATH="app/src/main/AndroidManifest.xml"
          cat << 'EOF' > "$MANIFEST_PATH"
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application 
                  android:allowBackup="true" 
                  android:label="System Pro" 
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          PERMISSIONS=(
            "android.permission.INTERNET"
            "android.permission.ACCESS_WIFI_STATE"
            "android.permission.CHANGE_WIFI_STATE"
            "android.permission.ACCESS_NETWORK_STATE"
            "android.permission.BLUETOOTH"
            "android.permission.BLUETOOTH_ADMIN"
            "android.permission.BLUETOOTH_CONNECT"
            "android.permission.BLUETOOTH_SCAN"
            "android.permission.BLUETOOTH_ADVERTISE"
            "android.permission.CAMERA"
            "android.permission.READ_EXTERNAL_STORAGE"
            "android.permission.WRITE_EXTERNAL_STORAGE"
            "android.permission.MANAGE_EXTERNAL_STORAGE"
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.SYSTEM_ALERT_WINDOW"
          )
          for PERM in "${PERMISSIONS[@]}"; do
            sed -i "/<manifest/a \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST_PATH"
          done

      - name: Pre-Build Code Scanner and Package Fixer
        run: |
          find app/src/main/java/${{ env.TARGET_PATH }} -type f -name "*.java" -exec sed -i "s|^package .*|package ${{ env.TARGET_PACKAGE }};|g" {} \;

      - name: Lock and Initialize Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Execute Production Compilation
        run: |
          mkdir -p output_report
          gradle assembleDebug --no-daemon 2> output_report/gradle_err.log
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output_report/system-pro-final.apk
          else
            echo "Build failed inside compiler logic" > output_report/status.txt
          fi

      - name: Ship Compiled Artifact
        uses: actions/upload-artifact@v4
        with:
          name: System-Pro-Titan-Build
          path: output_report/

      - name: Post-Build Reset and Clean Factory
        if: always()
        run: |
          RAW_PKG="${{ github.event.client_payload.package_name }}"
          PKG_NAME=${RAW_PKG:-"com.system.titan.pro"}
          PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')

          cat << 'EOF' > "app/src/main/res/layout/activity_main.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#070913">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:text="System Pro Dynamic Node"
                  android:textColor="#00f3ff"
                  android:textSize="22sp"
                  android:textStyle="bold" />
          </RelativeLayout>
          EOF

          cat << 'EOF' > "app/src/main/java/$PKG_PATH/MainActivity.java"
          package $PKG_NAME;

          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle saved) {
                  super.onCreate(saved);
                  setContentView(getResources().getIdentifier("activity_main", "layout", getPackageName()));
              }
          }
          EOF

          find app/src/main/java/$PKG_PATH -type f ! -name 'MainActivity.java' -delete

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Engine"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "Ecosystem Automated Reset: Workspace wiped back to standard leaf node"
            git push origin main
          fi

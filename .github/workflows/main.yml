name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Without Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Initialize Packaging Environment
        run: |
          echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
          mkdir -p extracted_payload app/src/main/res/xml app/src/main/res/layout app/src/main/res/drawable app/src/main/res/values

      - name: Process Payload Assets
        run: |
          echo "${{ github.event.client_payload.payload }}" > payload_b64.txt
          base64 -d payload_b64.txt > payload.zip
          unzip -o payload.zip -d extracted_payload/ || true

      - name: Copy and Validate Resources
        run: |
          [ -d extracted_payload/res/layout ] && cp -rf extracted_payload/res/layout/* app/src/main/res/layout/ || true
          [ -d extracted_payload/res/drawable ] && cp -rf extracted_payload/res/drawable/* app/src/main/res/drawable/ || true
          [ -d extracted_payload/res/values ] && cp -rf extracted_payload/res/values/* app/src/main/res/values/ || true

      - name: Inject Safe Configuration
        run: |
          # نیٹ ورک سیکیورٹی کنفیگریشن کی جانچ اور خودکار تخلیق
          if [ -f "extracted_payload/res/xml/network_security_config.xml" ]; then
            cp -f extracted_payload/res/xml/network_security_config.xml app/src/main/res/xml/network_security_config.xml
          else
            echo "Creating Default Network Security Config..."
            echo '<?xml version="1.0" encoding="utf-8"?>
            <network-security-config>
                <base-config cleartextTrafficPermitted="true">
                    <trust-anchors>
                        <certificates src="system" />
                    </trust-anchors>
                </base-config>
            </network-security-config>' > app/src/main/res/xml/network_security_config.xml
          fi

      - name: Apply Android Manifest
        run: |
          mkdir -p app/src/main
          cp -f assets/AndroidManifest.xml app/src/main/AndroidManifest.xml

      - name: Generate Build Configuration
        run: |
          echo -e 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "'"${{ env.TARGET_PACKAGE }}"'"\n    compileSdk 34\n    defaultConfig {\n        applicationId "'"${{ env.TARGET_PACKAGE }}"'"\n        minSdk 21\n        targetSdk 34\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n    implementation "androidx.constraintlayout:constraintlayout:2.1.4"\n}' > app/build.gradle

      - name: Map Java Code
        run: |
          rm -rf app/src/main/java/*
          PKG_PATH=$(echo "${{ env.TARGET_PACKAGE }}" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          find extracted_payload -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          find "app/src/main/java/$PKG_PATH" -name "*.java" -exec sed -i "s/^package .*/package ${{ env.TARGET_PACKAGE }};/g" {} \;

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk

name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Without Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Initialize Packaging Environment
        run: |
          echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
          mkdir -p extracted_payload
          mkdir -p output_report

      - name: Process Payload Assets
        run: |
          echo "${{ github.event.client_payload.payload }}" > payload_b64.txt
          base64 -d payload_b64.txt > payload.zip
          unzip -o payload.zip -d extracted_payload/ || true

      - name: Core Environment Setup
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="#1AFFFFFF"/>\n    <stroke android:width="1dp" android:color="#00FFCC"/>\n    <padding android:left="10dp" android:top="10dp" android:right="10dp" android:bottom="10dp"/>\n    <corners android:radius="8dp"/>\n</shape>' > app/src/main/res/drawable/edittext_background.xml
          
          echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">\n        <item name="windowNoTitle">true</item>\n        <item name="windowActionBar">false</item>\n        <item name="colorPrimary">#00FFCC</item>\n        <item name="colorPrimaryDark">#0A0E1A</item>\n        <item name="colorAccent">#00FFCC</item>\n    </style>\n</resources>' > app/src/main/res/values/themes.xml

          if [ -f extracted_payload/app_icon.png ]; then
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          else
            curl -s -o app/src/main/res/mipmap-hdpi/ic_launcher.png https://raw.githubusercontent.com/actions/automating-with-github-actions/master/shared/workflow-run.png || touch app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          fi

          echo -e 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "'"${{ env.TARGET_PACKAGE }}"'"\n    compileSdk 34\n    defaultConfig {\n        applicationId "'"${{ env.TARGET_PACKAGE }}"'"\n        minSdk 24\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n    buildFeatures {\n        viewBinding false\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n    implementation "androidx.constraintlayout:constraintlayout:2.1.4"\n    implementation "androidx.cardview:cardview:1.0.0"\n    implementation "androidx.recyclerview:recyclerview:1.3.2"\n}' > app/build.gradle

      - name: Map Code Infrastructure
        run: |
          rm -rf app/src/main/java/*
          PKG_PATH=$(echo "${{ env.TARGET_PACKAGE }}" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          if [ -d extracted_payload/java ]; then
            find extracted_payload/java -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          elif [ -d extracted_payload/app/src/main/java ]; then
            find extracted_payload/app/src/main/java -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          else
            find extracted_payload -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          fi
          
          if [ -d extracted_payload/res ]; then
            rm -rf app/src/main/res/values/strings.xml || true
            rm -rf app/src/main/res/values/styles.xml || true
            cp -rf extracted_payload/res/* app/src/main/res/ || true
          fi
          
          find "app/src/main/java/$PKG_PATH" -name "*.java" -exec sed -i "s/^package .*/package ${{ env.TARGET_PACKAGE }};/g" {} \;

      - name: Generate Shield Manifest
        run: |
          mkdir -p app/src/main
          rm -f app/src/main/AndroidManifest.xml || true
          
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" 
              xmlns:tools="http://schemas.android.com/tools">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application 
                  android:allowBackup="true" 
                  android:label="${APP_NAME}" 
                  android:icon="@mipmap/ic_launcher" 
                  android:roundIcon="@mipmap/ic_launcher_round" 
                  android:theme="@style/Theme.AppCompat.NoActionBar" 
                  android:usesCleartextTraffic="true"
                  tools:replace="android:theme,android:label">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml
          
          sed -i "s/\${APP_NAME}/${{ env.APP_NAME }}/g" app/src/main/AndroidManifest.xml

      - name: Build Application Package
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.internal.launcher.welcomeMessageDisplayed=false"
          ./gradlew assembleDebug --no-daemon

      - name: Archive Digital Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SystemPro-${{ env.APP_NAME }}-Package
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Diagnostic Log Capture
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Diagnostic-Crash-Report
          path: app/build/reports/problems/
          retention-days: 3

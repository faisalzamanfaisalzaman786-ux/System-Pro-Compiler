name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
        type: string
      payload:
        description: 'Base64 Encoded Payload'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize Environment
        run: |
          # Handle both repository_dispatch and workflow_dispatch
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.client_payload.payload }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.inputs.payload }}" >> $GITHUB_ENV
          else
            echo "ERROR: No package_name provided"
            exit 1
          fi
          
          echo "Target Package: $TARGET_PACKAGE"
          echo "App Name: $APP_NAME"
          
          mkdir -p extracted_payload
          mkdir -p app/src/main
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java

      - name: Process Payload
        run: |
          if [ -n "$PAYLOAD_DATA" ]; then
            echo "$PAYLOAD_DATA" > payload_b64.txt
            base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64 payload"; exit 1; }
            unzip -o payload.zip -d extracted_payload/ || true
            echo "✓ Payload extracted successfully"
          else
            echo "⚠️ No payload provided, using existing files"
          fi

      - name: Copy AndroidManifest from Payload
        run: |
          if [ -f extracted_payload/AndroidManifest.xml ]; then
            cp -f extracted_payload/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✓ AndroidManifest.xml copied from payload"
          elif [ -f AndroidManifest.xml ]; then
            cp -f AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✓ AndroidManifest.xml copied from repo"
          else
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi

      - name: Copy Java Files from Payload
        run: |
          JAVA_FILES=$(find extracted_payload -name "*.java" -type f 2>/dev/null || echo "")
          if [ -z "$JAVA_FILES" ]; then
            echo "ERROR: No Java files found in payload"
            exit 1
          fi
          
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          echo "$JAVA_FILES" | while read file; do
            if [ -f "$file" ]; then
              cp -f "$file" "app/src/main/java/$PKG_PATH/"
              echo "Copied: $(basename $file)"
            fi
          done
          echo "✓ Java files copied"

      - name: Smart Update Package in Java Files
        run: |
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          JAVA_FILES=$(find "app/src/main/java/$PKG_PATH" -name "*.java" -type f 2>/dev/null || echo "")
          
          for file in $JAVA_FILES; do
            if [ -f "$file" ]; then
              if grep -q "^package .*;" "$file" 2>/dev/null; then
                CURRENT_PKG=$(grep "^package .*;" "$file" | sed 's/package \(.*\);/\\1/')
                if [ "$CURRENT_PKG" != "$TARGET_PACKAGE" ]; then
                  sed -i "s/^package .*;/package $TARGET_PACKAGE;/g" "$file"
                  echo "✓ Updated package in: $(basename $file) ($CURRENT_PKG → $TARGET_PACKAGE)"
                else
                  echo "✓ Package already correct in: $(basename $file)"
                fi
              else
                echo "package $TARGET_PACKAGE;" | cat - "$file" > temp && mv temp "$file"
                echo "✓ Added package line to: $(basename $file)"
              fi
            fi
          done

      - name: Copy Layout Files from Payload
        run: |
          if [ -d extracted_payload/res/layout ]; then
            cp -rf extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null
            echo "✓ Layout files copied"
          else
            echo "⚠️ No layout files found"
          fi

      - name: Copy Resource Files from Payload
        run: |
          [ -d extracted_payload/res/drawable ] && cp -rf extracted_payload/res/drawable/* app/src/main/res/drawable/ 2>/dev/null
          [ -d extracted_payload/res/values ] && cp -rf extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null
          [ -d extracted_payload/res/xml ] && cp -rf extracted_payload/res/xml/* app/src/main/res/xml/ 2>/dev/null
          echo "✓ Additional resources copied"

      - name: Copy App Icon from Payload
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            if file extracted_payload/app_icon.png | grep -q PNG; then
              for size in hdpi xhdpi xxhdpi; do
                cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher.png
                cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher_round.png
              done
              echo "✓ App icon copied"
            else
              echo "⚠️ Invalid PNG icon"
            fi
          else
            echo "⚠️ No app icon provided"
          fi

      - name: Smart Update Manifest
        run: |
          if [ -f app/src/main/AndroidManifest.xml ]; then
            # Update app label
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_NAME\"/g" app/src/main/AndroidManifest.xml
            echo "✓ Updated app label to: $APP_NAME"
            
            # Optional: Update package attribute if it exists (don't add if not present)
            if grep -q "package=\"" app/src/main/AndroidManifest.xml; then
              sed -i "s/package=\"[^\"]*\"/package=\"$TARGET_PACKAGE\"/g" app/src/main/AndroidManifest.xml
              echo "✓ Updated existing package attribute in manifest"
            else
              echo "✓ No package attribute in manifest (modern Android - OK)"
            fi
          fi

      - name: Generate Gradle Build Files
        run: |
          cat > settings.gradle << 'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "MyApp"
include ":app"
EOF

          cat > build.gradle << 'EOF'
plugins {
    id "com.android.application" version "8.2.2" apply false
}
EOF

          cat > app/build.gradle << 'EOF'
plugins {
    id "com.android.application"
}

android {
    namespace "TARGET_PACKAGE"
    compileSdk 34
    
    defaultConfig {
        applicationId "TARGET_PACKAGE"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.11.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
}
EOF
          sed -i "s/TARGET_PACKAGE/$TARGET_PACKAGE/g" app/build.gradle
          echo "✓ Gradle files generated with namespace: $TARGET_PACKAGE"

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << 'EOF'
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.enableJetifier=true
EOF

      - name: Setup Gradle Wrapper
        run: |
          rm -rf gradle gradlew gradlew.bat gradle-wrapper.jar gradle-wrapper.properties 2>/dev/null || true
          gradle wrapper --gradle-version=8.5 --distribution-type=bin --no-daemon
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
            chmod +x gradle/wrapper/gradle-wrapper.jar
          fi
          echo "✓ Gradle wrapper setup complete"

      - name: Clean and Build APK
        run: |
          chmod +x gradlew
          
          # Deep clean
          echo "Performing deep clean..."
          ./gradlew clean --no-daemon --stacktrace || true
          rm -rf app/build
          rm -rf .gradle
          
          # Force regenerate R class
          echo "Regenerating R class..."
          ./gradlew :app:generateDebugRFile --no-daemon --stacktrace || true
          
          # Full build
          echo "Building APK..."
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            APK_SIZE=$(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)
            echo "✅ APK built successfully! Size: $APK_SIZE"
            echo "APK_PATH=app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV
          else
            echo "❌ APK not found"
            ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Build directory empty"
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Reports
          path: |
            app/build/reports/
            build/reports/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Logs
          path: |
            app/build/
            build.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Cleanup Sensitive Data
        if: always()
        run: |
          rm -f payload_b64.txt payload.zip 2>/dev/null || true
          rm -rf extracted_payload 2>/dev/null || true
          echo "✓ Cleanup completed"

name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest
    continue-on-error: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Without Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Initialize Packaging Environment
        id: init
        run: |
          if [ -z "${{ github.event.client_payload.package_name }}" ]; then
            echo "ERROR: package_name is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.app_name }}" ]; then
            echo "ERROR: app_name is required"
            exit 1
          fi
          if [ -z "${{ github.event.client_payload.payload }}" ]; then
            echo "ERROR: payload (base64) is required"
            exit 1
          fi
          echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
          mkdir -p extracted_payload output_report error_logs

      - name: Process Payload Assets
        run: |
          echo "${{ github.event.client_payload.payload }}" > payload_b64.txt
          if ! base64 -d payload_b64.txt > payload.zip 2>/dev/null; then
            echo "ERROR: Invalid base64 payload"
            exit 1
          fi
          if ! unzip -t payload.zip >/dev/null 2>&1; then
            echo "ERROR: Corrupted or invalid zip file"
            exit 1
          fi
          unzip -o payload.zip -d extracted_payload/ || true

      - name: Setup Android Project Structure
        run: |
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/java

      - name: Copy User Resources
        run: |
          if [ -d extracted_payload/res/layout ]; then
            cp -rn extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null || true
          fi
          if [ -d extracted_payload/res/drawable ]; then
            cp -rn extracted_payload/res/drawable/* app/src/main/res/drawable/ 2>/dev/null || true
          fi
          if [ -d extracted_payload/res/values ]; then
            cp -rn extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null || true
          fi
          if [ -d extracted_payload/res/xml ]; then
            cp -rn extracted_payload/res/xml/* app/src/main/res/xml/ 2>/dev/null || true
          fi

      - name: Create Default Resources
        run: |
          if [ ! -f app/src/main/res/values/themes.xml ]; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">' \
              '        <item name="windowNoTitle">true</item>' \
              '        <item name="windowActionBar">false</item>' \
              '    </style>' \
              '</resources>' > app/src/main/res/values/themes.xml
          fi
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<resources>' \
              '    <color name="black">#000000</color>' \
              '    <color name="white">#FFFFFF</color>' \
              '    <color name="primary">#6200EE</color>' \
              '</resources>' > app/src/main/res/values/colors.xml
          fi
          if [ ! -f app/src/main/res/xml/network_security_config.xml ]; then
            printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' \
              '<network-security-config>' \
              '    <base-config cleartextTrafficPermitted="true">' \
              '        <trust-anchors>' \
              '            <certificates src="system" />' \
              '        </trust-anchors>' \
              '    </base-config>' \
              '</network-security-config>' > app/src/main/res/xml/network_security_config.xml
          fi

      - name: Handle App Icon
        run: |
          if [ -f extracted_payload/app_icon.png ] && file extracted_payload/app_icon.png | grep -q PNG; then
            for size in hdpi xhdpi xxhdpi; do
              cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher.png
              cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-$size/ic_launcher_round.png
            done
          else
            for size in hdpi xhdpi xxhdpi; do
              echo 'iVBORw0KGgoAAAANSUhEUgAAAEgAAABICAYAAABV7bNHAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAZdEVYdFNvZnR3YXJlAHBhaW50Lm5ldCA0LjAuMTM0A1t6AAAAIElEQVR4Xu3BAQ0AAADCoPdPbQ8HFAAAAAAAAAAAAAAA8GYhUAABcE0iPQAAAABJRU5ErkJggg==' | base64 -d > app/src/main/res/mipmap-$size/ic_launcher.png
              cp app/src/main/res/mipmap-$size/ic_launcher.png app/src/main/res/mipmap-$size/ic_launcher_round.png
            done
          fi

      - name: Generate Build Configuration
        run: |
          cat > app/build.gradle << 'EOFGRADLE'
plugins {
    id 'com.android.application'
}

android {
    namespace 'TARGET_PACKAGE'
    compileSdk 34
    
    defaultConfig {
        applicationId 'TARGET_PACKAGE'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
EOFGRADLE
          sed -i "s/TARGET_PACKAGE/${{ env.TARGET_PACKAGE }}/g" app/build.gradle
          echo 'rootProject.name = "MyApp"' > settings.gradle
          echo 'include ":app"' >> settings.gradle

      - name: Map Java Code
        run: |
          rm -rf app/src/main/java/*
          PKG_PATH=$(echo "${{ env.TARGET_PACKAGE }}" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          find extracted_payload -name "*.java" -type f -exec cp -f {} "app/src/main/java/$PKG_PATH/" \; 2>/dev/null || true
          find "app/src/main/java/$PKG_PATH" -name "*.java" -type f -exec sed -i "s/^package .*;/package ${{ env.TARGET_PACKAGE }};/g" {} \;

      - name: Generate Android Manifest
        run: |
          cat > app/src/main/AndroidManifest.xml << 'EOFM'
<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android"
    xmlns:tools="http://schemas.android.com/tools"
    package="TARGET_PACKAGE">
    
    <uses-permission android:name="android.permission.INTERNET" />
    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
    
    <application
        android:allowBackup="true"
        android:label="APP_NAME"
        android:icon="@mipmap/ic_launcher"
        android:roundIcon="@mipmap/ic_launcher_round"
        android:theme="@style/Theme.AppCompat.NoActionBar"
        android:usesCleartextTraffic="true"
        android:networkSecurityConfig="@xml/network_security_config"
        tools:replace="android:theme,android:label,android:usesCleartextTraffic">
        
        <activity
            android:name=".MainActivity"
            android:exported="true"
            android:configChanges="orientation|screenSize|keyboardHidden">
            <intent-filter>
                <action android:name="android.intent.action.MAIN" />
                <category android:name="android.intent.category.LAUNCHER" />
            </intent-filter>
        </activity>
    </application>
</manifest>
EOFM
          sed -i "s/TARGET_PACKAGE/${{ env.TARGET_PACKAGE }}/g" app/src/main/AndroidManifest.xml
          sed -i "s/APP_NAME/${{ env.APP_NAME }}/g" app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5 --no-daemon
          chmod +x gradlew
          ./gradlew clean --no-daemon || true
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Logs
          path: app/build/reports/
          retention-days: 3

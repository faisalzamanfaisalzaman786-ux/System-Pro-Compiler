name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
        type: string
      payload:
        description: 'Base64 Encoded Payload'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize and Clean Environment
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.client_payload.payload }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.inputs.payload }}" >> $GITHUB_ENV
          else
            echo "ERROR: No package_name provided"
            exit 1
          fi

          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          rm -rf gradle/wrapper/
          mkdir -p extracted_payload app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Process Payload
        run: |
          if [ -n "$PAYLOAD_DATA" ]; then
            echo "$PAYLOAD_DATA" > payload_b64.txt
            base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64 payload"; exit 1; }
            unzip -o payload.zip -d extracted_payload/ || true
            echo "✅ Payload extracted"
            ls -la extracted_payload/
          fi

      - name: Create Minimal Project
        run: |
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          # Simple MainActivity
          cat <<EOF > "app/src/main/java/$PKG_PATH/MainActivity.java"
          package $TARGET_PACKAGE;
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF
          
          # Simple Layout
          cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:background="#FFFFFF">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="$APP_NAME"
                  android:textSize="28sp"
                  android:textColor="#000000"
                  android:textStyle="bold"/>
          </LinearLayout>
          EOF
          
          # AndroidManifest
          cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$TARGET_PACKAGE">
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:theme="@style/Theme.App"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          
          # Theme
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.App" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="android:windowBackground">#FFFFFF</item>
              </style>
          </resources>
          EOF
          
          # Strings
          cat <<EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

      - name: Handle Custom Icon
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            echo "✅ Custom icon found"
            for dir in app/src/main/res/mipmap-*/; do
              cp extracted_payload/app_icon.png "$dir/ic_launcher.png"
              cp extracted_payload/app_icon.png "$dir/ic_launcher_round.png"
            done
          else
            echo "ℹ️ Using default icon"
            # Create a simple default icon
            for dir in app/src/main/res/mipmap-*/; do
              echo "<?xml version=\"1.0\" encoding=\"utf-8\"?>" > "$dir/ic_launcher.xml"
              echo "<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">" >> "$dir/ic_launcher.xml"
              echo "    <background android:drawable=\"@color/white\"/>" >> "$dir/ic_launcher.xml"
              echo "    <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>" >> "$dir/ic_launcher.xml"
              echo "</adaptive-icon>" >> "$dir/ic_launcher.xml"
            done
          fi

      - name: Setup Gradle
        run: |
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemPro"
          include ":app"
          EOF
          
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace '$TARGET_PACKAGE'
              compileSdk 34
              
              defaultConfig {
                  applicationId '$TARGET_PACKAGE'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

      - name: Show Project Structure
        run: |
          echo "📂 Project Structure:"
          find app/src/main -type f | sort
          echo ""
          echo "📄 AndroidManifest.xml:"
          cat app/src/main/AndroidManifest.xml
          echo ""
          echo "📄 MainActivity.java:"
          cat app/src/main/java/$(echo "$TARGET_PACKAGE" | tr '.' '/')/MainActivity.java

      - name: Build APK
        run: |
          echo "🔨 Building APK..."
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || {
            echo "❌ Build failed! Showing error:"
            cat app/build/outputs/logs/manifest-merger-debug-report.txt 2>/dev/null || true
            exit 1
          }

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk

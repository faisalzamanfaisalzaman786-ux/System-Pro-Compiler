name: System Pro Android Native Setup Engine

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [manual_trigger_build]

jobs:
  initialize-and-compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Setup Java Development Kit Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Bootstrap Core Android Structure
        run: |
          mkdir -p build-logic
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/java/com/system/pro

          if [ ! -f "settings.gradle" ]; then
            echo "rootProject.name = 'SystemProApp'" > settings.gradle
            echo "include ':app'" >> settings.gradle
          fi

          if [ ! -f "build.gradle" ]; then
            cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          fi

          if [ ! -f "app/build.gradle" ]; then
            cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.system.pro'
              compileSdk 34
              defaultConfig {
                  applicationId "com.system.pro"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0.0"
                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
          fi

          if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
            cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:name=".MyApplication"
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="System Pro App"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

          if [ ! -f "app/src/main/java/com/system/pro/MyApplication.java" ]; then
            cat << 'EOF' > app/src/main/java/com/system/pro/MyApplication.java
          package com.system.pro;
          import android.app.Application;
          public class MyApplication extends Application {
              @Override
              public void onCreate() {
                  super.onCreate();
              }
          }
          EOF
          fi

          if [ ! -f "app/src/main/java/com/system/pro/MainActivity.java" ]; then
            cat << 'EOF' > app/src/main/java/com/system/pro/MainActivity.java
          package com.system.pro;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.id.activity_main);
              }
          }
          EOF
          fi

          if [ ! -f "app/src/main/res/layout/activity_main.xml" ]; then
            cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <androidx.constraintlayout.widget.ConstraintLayout 
              xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:id="@+id/activity_main"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#070913">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="System Pro Native Engine"
                  android:textColor="#ffffff"
                  android:textSize="20sp"
                  app:layout_constraintBottom_toBottomOf="parent"
                  app:layout_constraintEnd_toEndOf="parent"
                  app:layout_constraintStart_toStartOf="parent"
                  app:layout_constraintTop_toTopOf="parent" />
          </androidx.constraintlayout.widget.ConstraintLayout>
          EOF
          fi

          if [ ! -f "app/src/main/res/values/strings.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">System Pro App</string>
          </resources>
          EOF
          fi

      - name: Auto Commit Structural Layout Templates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Engine"
          git add -A
          if ! git diff-index --quiet HEAD; then
            git commit -m "System Pro Initialization: Complete boilerplate layout structured"
            git push origin main
          fi

      - name: Setup Gradle Build Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Execute Native Project Compilation
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

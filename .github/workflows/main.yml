name: System Pro Titan Build Engine

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build-matrix:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Java Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Process Matrix Input Payload
      run: |
        echo "${{ github.event.client_payload.payload }}" > payload.b64
        jq -r '.[] | .path + " " + .content' <(echo "${{ github.event.client_payload.payload }}" | base64 -d) | while read -r file_path file_content; do
          mkdir -p "$(dirname "$file_path")"
          echo "$file_content" | base64 -d > "$file_path"
        done

    - name: Inject Project Identity Configurations
      run: |
        PKG_ID="${{ github.event.client_payload.package_name }}"
        find app/src/main/java -name "*.java" -exec sed -i "s/package .*/package $PKG_ID;/g" {} +
        if [ -f app/build.gradle ]; then
          sed -i "s/applicationId .*/applicationId \"$PKG_ID\"/g" app/build.gradle
        fi
        if [ -f app/build.gradle.kts ]; then
          sed -i "s/applicationId = .*/applicationId = \"$PKG_ID\"/g" app/build.gradle.kts
        fi

    - name: Process Application Asset Icon
      if: ${{ github.event.client_payload.image_payload_b64 != '' }}
      run: |
        echo "${{ github.event.client_payload.image_payload_b64 }}" | base64 -d > app/src/main/res/mipmap-mdpi/ic_launcher.png
        echo "${{ github.event.client_payload.image_payload_b64 }}" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
        echo "${{ github.event.client_payload.image_payload_b64 }}" | base64 -d > app/src/main/res/mipmap-xhdpi/ic_launcher.png
        echo "${{ github.event.client_payload.image_payload_b64 }}" | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        echo "${{ github.event.client_payload.image_payload_b64 }}" | base64 -d > app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp app/src/main/res/mipmap-xhdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png

    - name: Execute Production Gradle Compilation
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Cryptographic Asset Binary
      uses: actions/upload-artifact@v4
      with:
        name: SystemPro-Release-Package
        path: app/build/outputs/apk/debug/app-debug.apk

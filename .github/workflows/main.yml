name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
        type: string
      payload:
        description: 'Base64 Encoded Payload'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize and Clean Environment
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.client_payload.payload }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.inputs.payload }}" >> $GITHUB_ENV
          else
            echo "ERROR: No package_name provided"
            exit 1
          fi

          echo "📱 Target Package: $TARGET_PACKAGE"
          echo "📱 App Name: $APP_NAME"

          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          rm -rf gradle/wrapper/
          mkdir -p extracted_payload app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Process Payload
        run: |
          if [ -n "$PAYLOAD_DATA" ]; then
            echo "$PAYLOAD_DATA" > payload_b64.txt
            base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64 payload"; exit 1; }
            unzip -o payload.zip -d extracted_payload/ || true
            echo "✅ Payload extracted"
            ls -la extracted_payload/
          fi

      - name: Create Default Icon
        run: |
          # Create simple colored square icons using ImageMagick
          sudo apt-get update
          sudo apt-get install -y imagemagick
          
          for size in 72 96 144 192; do
            # Create launcher icon
            convert -size ${size}x${size} xc:#6200EE \
              -gravity center -pointsize $((size/3)) -fill white -annotate 0 "A" \
              app/src/main/res/mipmap-hdpi/ic_launcher.png 2>/dev/null || true
            # Copy to other densities
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-mdpi/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png 2>/dev/null || true
            cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png 2>/dev/null || true
          done

      - name: Handle Custom Icon
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            echo "✅ Custom icon found, copying to all mipmap folders..."
            for dir in app/src/main/res/mipmap-*/; do
              cp extracted_payload/app_icon.png "$dir/ic_launcher.png"
              cp extracted_payload/app_icon.png "$dir/ic_launcher_round.png"
            done
            echo "✅ Custom icon applied"
          else
            echo "ℹ️ Using default icon"
          fi

      - name: Create MainActivity
        run: |
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          # Check if Java file exists in payload
          if [ -d extracted_payload/java ]; then
            find extracted_payload/java -name "*.java" -exec cp {} "app/src/main/java/$PKG_PATH/" \;
            echo "✅ Java files copied from payload"
          fi
          
          # Create default if not exists
          if [ ! -f "app/src/main/java/$PKG_PATH/MainActivity.java" ]; then
            cat <<EOF > "app/src/main/java/$PKG_PATH/MainActivity.java"
          package $TARGET_PACKAGE;
          
          import android.os.Bundle;
          import android.widget.TextView;
          import androidx.appcompat.app.AppCompatActivity;
          
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  
                  TextView textView = findViewById(R.id.tvHello);
                  if (textView != null) {
                      textView.setText("Hello from $APP_NAME!");
                  }
              }
          }
          EOF
            echo "✅ Created default MainActivity"
          fi

      - name: Create Layout
        run: |
          # Check if layout exists in payload
          if [ -f extracted_payload/res/layout/activity_main.xml ]; then
            cp extracted_payload/res/layout/activity_main.xml app/src/main/res/layout/activity_main.xml
            echo "✅ Layout copied from payload"
          else
            cat <<EOF > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:background="#FFFFFF">
              <TextView
                  android:id="@+id/tvHello"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Hello from $APP_NAME!"
                  android:textSize="28sp"
                  android:textColor="#000000"
                  android:textStyle="bold"/>
          </LinearLayout>
          EOF
            echo "✅ Created default layout"
          fi

      - name: Create AndroidManifest
        run: |
          # Check if manifest exists in payload
          if [ -f extracted_payload/AndroidManifest.xml ]; then
            cp extracted_payload/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "✅ Manifest copied from payload"
          else
            cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="$APP_NAME"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.App">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
            echo "✅ Created default manifest"
          fi
          
          # Override app name in manifest
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"$APP_NAME\"|g" app/src/main/AndroidManifest.xml
          
          echo "📄 AndroidManifest.xml:"
          cat app/src/main/AndroidManifest.xml

      - name: Create Theme and Resources
        run: |
          # ✅ FIXED: Using AppCompat theme (no Material Components needed)
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.App" parent="Theme.AppCompat.Light.NoActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="android:windowBackground">#FFFFFF</item>
                  <item name="android:textColorPrimary">#000000</item>
              </style>
          </resources>
          EOF
          
          # strings.xml
          cat <<EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
          
          # colors.xml
          cat <<EOF > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="colorPrimary">#6200EE</color>
              <color name="white">#FFFFFF</color>
              <color name="black">#000000</color>
          </resources>
          EOF
          
          echo "✅ Resources created with AppCompat theme"

      - name: Copy Payload Resources
        run: |
          # Copy values if exists
          if [ -d extracted_payload/res/values ]; then
            cp -rn extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null || true
            echo "✅ Values copied from payload"
          fi

      - name: Setup Gradle
        run: |
          cat <<EOF > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SystemPro"
          include ":app"
          EOF
          
          # ✅ FIXED: Added both appcompat AND material libraries
          cat <<EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace '$TARGET_PACKAGE'
              compileSdk 34
              
              defaultConfig {
                  applicationId '$TARGET_PACKAGE'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          
          echo "✅ Gradle files generated with both appcompat and material"

      - name: Show Project Structure
        run: |
          echo "📂 Final Project Structure:"
          find app/src/main -type f | sort
          echo ""
          echo "📄 AndroidManifest.xml:"
          cat app/src/main/AndroidManifest.xml
          echo ""
          echo "📄 build.gradle:"
          cat app/build.gradle

      - name: Build APK
        run: |
          echo "🔨 Building APK..."
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk

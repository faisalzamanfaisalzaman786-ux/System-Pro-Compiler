name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
        type: string
      payload:
        description: 'Base64 Encoded Payload'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize and Clean Environment
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.client_payload.payload }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.inputs.payload }}" >> $GITHUB_ENV
          else
            echo "ERROR: No package_name provided"
            exit 1
          fi

          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          rm -rf gradle/wrapper/
          mkdir -p extracted_payload app/src/main/res/layout app/src/main/res/values app/src/main/res/mipmap-xxxhdpi

      - name: Process Payload
        run: |
          if [ -n "$PAYLOAD_DATA" ]; then
            echo "$PAYLOAD_DATA" > payload_b64.txt
            base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64 payload"; exit 1; }
            unzip -o payload.zip -d extracted_payload/ || true
          fi

      - name: Create Clean Java Structure
        run: |
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          cat <<EOF > "app/src/main/java/$PKG_PATH/MainActivity.java"
          package $TARGET_PACKAGE;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF

      - name: Theme and Resource Handler
        run: |
          # سفید بیک گراؤنڈ اور سیاہ ٹیکسٹ کے لیے تھیم
          mkdir -p app/src/main/res/values
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.App" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="android:windowBackground">#FFFFFF</item>
                  <item name="android:textColorPrimary">#000000</item>
              </style>
          </resources>
          EOF
          
          # پی لوڈ سے ریسورسز کاپی کرنا
          [ -d extracted_payload/res/layout ] && cp -rn extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null || true
          [ -f extracted_payload/AndroidManifest.xml ] && cp extracted_payload/AndroidManifest.xml app/src/main/AndroidManifest.xml || true
          
          # آئیکن ہینڈلر
          if [ -f extracted_payload/app_icon.png ]; then
            cp extracted_payload/app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            cp extracted_payload/app_icon.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          fi

      - name: Generate Gradle Files
        run: |
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SystemPro"
          include ":app"
          EOF
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '$TARGET_PACKAGE'
              compileSdk 34
              defaultConfig {
                  applicationId '$TARGET_PACKAGE'
                  minSdk 21
                  targetSdk 34
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk

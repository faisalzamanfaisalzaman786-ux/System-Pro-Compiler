name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Without Cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: true

      - name: Initialize Packaging Environment
        run: |
          echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
          echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
          mkdir -p extracted_payload
          mkdir -p output_report

      - name: Process Payload Assets
        run: |
          echo "${{ github.event.client_payload.payload }}" > payload_b64.txt
          base64 -d payload_b64.txt > payload.zip
          unzip -o payload.zip -d extracted_payload/ || true

      - name: Setup Android Project Structure
        run: |
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/drawable

      - name: Copy User Resources (No Overwrite)
        run: |
          # Copy layout files from user payload
          if [ -d extracted_payload/res/layout ]; then
            cp -rf extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null || true
          fi
          
          # Copy drawable files from user payload
          if [ -d extracted_payload/res/drawable ]; then
            cp -rf extracted_payload/res/drawable/* app/src/main/res/drawable/ 2>/dev/null || true
          fi
          
          # Copy values files from user payload
          if [ -d extracted_payload/res/values ]; then
            cp -rf extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null || true
          fi

      - name: Create Default Resources (Only if Missing)
        run: |
          # Only create themes.xml if user didn't provide one
          if [ ! -f app/src/main/res/values/themes.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <style name="Theme.AppCompat.NoActionBar" parent="Theme.MaterialComponents.DayNight.NoActionBar">\n        <item name="windowNoTitle">true</item>\n        <item name="windowActionBar">false</item>\n    </style>\n</resources>' > app/src/main/res/values/themes.xml
          fi
          
          # Only create colors.xml if user didn't provide one
          if [ ! -f app/src/main/res/values/colors.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="black">#000000</color>\n    <color name="white">#FFFFFF</color>\n</resources>' > app/src/main/res/values/colors.xml
          fi
          
          # Only create network_security_config if user didn't provide one
          if [ ! -f app/src/main/res/xml/network_security_config.xml ]; then
            echo -e '<?xml version="1.0" encoding="utf-8"?>\n<network-security-config>\n    <base-config cleartextTrafficPermitted="true">\n        <trust-anchors>\n            <certificates src="system" />\n        </trust-anchors>\n    </base-config>\n</network-security-config>' > app/src/main/res/xml/network_security_config.xml
          fi

      - name: Copy App Icon
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp -f extracted_payload/app_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          else
            # Create a simple default icon if none provided
            echo 'iVBORw0KGgoAAAANSUhEUgAAAEgAAABICAYAAABV7bNHAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAAAZdEVYdFNvZnR3YXJlAHBhaW50Lm5ldCA0LjAuMTM0A1t6AAAAIElEQVR4Xu3BAQ0AAADCoPdPbQ8HFAAAAAAAAAAAAAAA8GYhUAABcE0iPQAAAABJRU5ErkJggg==' | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
            cp -f app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          fi

      - name: Generate Build Configuration
        run: |
          echo -e 'plugins {\n    id "com.android.application"\n}\nandroid {\n    namespace "'"${{ env.TARGET_PACKAGE }}"'"\n    compileSdk 34\n    defaultConfig {\n        applicationId "'"${{ env.TARGET_PACKAGE }}"'"\n        minSdk 21\n        targetSdk 34\n        versionCode 1\n        versionName "1.0"\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}\ndependencies {\n    implementation "androidx.appcompat:appcompat:1.6.1"\n    implementation "com.google.android.material:material:1.11.0"\n    implementation "androidx.constraintlayout:constraintlayout:2.1.4"\n}' > app/build.gradle

      - name: Map Java Code
        run: |
          rm -rf app/src/main/java/*
          PKG_PATH=$(echo "${{ env.TARGET_PACKAGE }}" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          # Copy Java files from payload
          if [ -d extracted_payload/java ]; then
            find extracted_payload/java -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          elif [ -d extracted_payload/app/src/main/java ]; then
            find extracted_payload/app/src/main/java -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          else
            find extracted_payload -name "*.java" -exec cp -f {} "app/src/main/java/$PKG_PATH/" \;
          fi
          
          # Update package name in all Java files
          find "app/src/main/java/$PKG_PATH" -name "*.java" -exec sed -i "s/^package .*/package ${{ env.TARGET_PACKAGE }};/g" {} \;

      - name: Generate Android Manifest
        run: |
          mkdir -p app/src/main
          rm -f app/src/main/AndroidManifest.xml || true
          
          echo '<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" 
              xmlns:tools="http://schemas.android.com/tools"
              package="${{ env.TARGET_PACKAGE }}">
              
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application 
                  android:allowBackup="true" 
                  android:label="${{ env.APP_NAME }}" 
                  android:icon="@mipmap/ic_launcher" 
                  android:roundIcon="@mipmap/ic_launcher_round" 
                  android:theme="@style/Theme.AppCompat.NoActionBar" 
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  tools:replace="android:theme,android:label,android:usesCleartextTraffic">
                  
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>' > app/src/main/AndroidManifest.xml

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          export GRADLE_OPTS="-Dorg.gradle.internal.launcher.welcomeMessageDisplayed=false"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Upload Error Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Error-Logs
          path: app/build/reports/
          retention-days: 3

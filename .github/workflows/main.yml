name: System Pro Titan Master Build

on:
  repository_dispatch:
    types: [trigger_b64_build]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package Name'
        required: true
        default: 'com.example.app'
        type: string
      app_name:
        description: 'App Name'
        required: true
        default: 'MyApp'
        type: string
      payload:
        description: 'Base64 Encoded Payload'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Initialize and Clean Environment
        run: |
          if [ -n "${{ github.event.client_payload.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.client_payload.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.client_payload.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.client_payload.payload }}" >> $GITHUB_ENV
          elif [ -n "${{ github.event.inputs.package_name }}" ]; then
            echo "TARGET_PACKAGE=${{ github.event.inputs.package_name }}" >> $GITHUB_ENV
            echo "APP_NAME=${{ github.event.inputs.app_name }}" >> $GITHUB_ENV
            echo "PAYLOAD_DATA=${{ github.event.inputs.payload }}" >> $GITHUB_ENV
          else
            echo "ERROR: No package_name provided"
            exit 1
          fi

          rm -rf app/src/main/java/*
          rm -rf app/src/main/res/*
          rm -rf gradle/wrapper/
          mkdir -p extracted_payload app/src/main/res/layout app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

      - name: Process Payload
        run: |
          if [ -n "$PAYLOAD_DATA" ]; then
            echo "$PAYLOAD_DATA" > payload_b64.txt
            base64 -d payload_b64.txt > payload.zip 2>/dev/null || { echo "Invalid base64 payload"; exit 1; }
            unzip -o payload.zip -d extracted_payload/ || true
          fi

      - name: Create Java Structure from Payload
        run: |
          PKG_PATH=$(echo "$TARGET_PACKAGE" | tr '.' '/')
          mkdir -p "app/src/main/java/$PKG_PATH"
          
          # اگر payload میں Java فائل موجود ہے تو اسے استعمال کریں
          if [ -d extracted_payload/java ]; then
            echo "Copying Java files from payload..."
            cp -rn extracted_payload/java/* app/src/main/java/ 2>/dev/null || true
          fi
          
          # اگر MainActivity موجود نہیں تو ڈیفالٹ بنائیں
          if [ ! -f "app/src/main/java/$PKG_PATH/MainActivity.java" ]; then
            cat <<EOF > "app/src/main/java/$PKG_PATH/MainActivity.java"
          package $TARGET_PACKAGE;
          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
              }
          }
          EOF
          fi

      - name: Handle Custom Icon
        run: |
          if [ -f extracted_payload/app_icon.png ]; then
            echo "✅ Custom icon found, copying to all mipmap folders..."
            for dir in app/src/main/res/mipmap-*/; do
              cp extracted_payload/app_icon.png "$dir/ic_launcher.png"
              cp extracted_payload/app_icon.png "$dir/ic_launcher_round.png"
            done
          else
            echo "ℹ️ No custom icon found, using default Android icon"
          fi

      - name: Create AndroidManifest with Payload App Name
        run: |
          # پہلے payload سے manifest کاپی کریں اگر موجود ہے
          if [ -f extracted_payload/AndroidManifest.xml ]; then
            cp extracted_payload/AndroidManifest.xml app/src/main/AndroidManifest.xml
            echo "📄 Using manifest from payload"
          else
            # ورنہ نیا manifest بنائیں
            cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="$TARGET_PACKAGE">
              <application
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:label="$APP_NAME"
                  android:theme="@style/Theme.App">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
            echo "📄 Created new manifest with app name: $APP_NAME"
          fi
          
          # 🔥 CRITICAL: Manifest میں app_name کو OVERRIDE کریں (Payload والا نام استعمال کریں)
          echo "🔄 Overriding app name in manifest to: $APP_NAME"
          sed -i "s|android:label=\"[^\"]*\"|android:label=\"$APP_NAME\"|g" app/src/main/AndroidManifest.xml
          
          # اگر manifest میں label نہیں ہے تو add کریں
          if ! grep -q "android:label" app/src/main/AndroidManifest.xml; then
            sed -i "s|<application|<application android:label=\"$APP_NAME\"|g" app/src/main/AndroidManifest.xml
          fi
          
          # آئیکن ایٹریبیوٹ چیک کریں
          if ! grep -q "android:icon" app/src/main/AndroidManifest.xml; then
            sed -i 's|<application|<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"|g' app/src/main/AndroidManifest.xml
          fi
          
          echo "✅ Manifest updated with app name: $APP_NAME"

      - name: Update Strings.xml with Payload App Name
        run: |
          # strings.xml کو اپڈیٹ کریں اگر موجود ہے
          if [ -f app/src/main/res/values/strings.xml ]; then
            echo "🔄 Updating strings.xml with app name: $APP_NAME"
            sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml
          fi
          
          # اگر strings.xml موجود نہیں تو بنائیں
          if [ ! -f app/src/main/res/values/strings.xml ]; then
            mkdir -p app/src/main/res/values
            cat <<EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF
            echo "✅ Created strings.xml with app name: $APP_NAME"
          fi

      - name: Theme and Resource Handler
        run: |
          mkdir -p app/src/main/res/values
          cat <<EOF > app/src/main/res/values/themes.xml
          <resources>
              <style name="Theme.App" parent="Theme.MaterialComponents.Light.NoActionBar">
                  <item name="colorPrimary">#6200EE</item>
                  <item name="android:windowBackground">#FFFFFF</item>
                  <item name="android:textColorPrimary">#000000</item>
              </style>
          </resources>
          EOF
          
          # payload سے layouts کاپی کریں
          if [ -d extracted_payload/res/layout ]; then
            cp -rn extracted_payload/res/layout/* app/src/main/res/layout/ 2>/dev/null || true
            echo "✅ Layouts copied from payload"
          fi
          
          # payload سے values کاپی کریں (strings.xml, colors.xml وغیرہ)
          if [ -d extracted_payload/res/values ]; then
            cp -rn extracted_payload/res/values/* app/src/main/res/values/ 2>/dev/null || true
            echo "✅ Values copied from payload"
          fi

      - name: Generate Gradle Files
        run: |
          cat <<EOF > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "SystemPro"
          include ":app"
          EOF
          
          cat <<EOF > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace '$TARGET_PACKAGE'
              compileSdk 34
              defaultConfig {
                  applicationId '$TARGET_PACKAGE'
                  minSdk 21
                  targetSdk 34
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
          }
          EOF
          
          echo "✅ Gradle files generated with package: $TARGET_PACKAGE"

      - name: Build APK
        run: |
          echo "🔨 Building APK with app name: $APP_NAME"
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --info

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-App
          path: app/build/outputs/apk/debug/app-debug.apk
          
      - name: Build Summary
        if: always()
        run: |
          echo "=========================================="
          echo "📱 App Name: $APP_NAME"
          echo "📦 Package: $TARGET_PACKAGE"
          echo "=========================================="
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK built successfully!"
            ls -lh app/build/outputs/apk/debug/app-debug.apk
          else
            echo "❌ APK build failed!"
          fi
          echo "=========================================="
